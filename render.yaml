# Render Blueprint: New → Blueprint → выбрать этот репозиторий.
# Render спросит только BOT_TOKEN; адрес сервиса придёт сам в RENDER_EXTERNAL_URL.
services:
  - type: web
    name: concert-pnl
    runtime: python
    plan: free
    # Зависимости строго по requirements.txt; сам пакет — editable, чтобы frontend/ лежал рядом
    buildCommand: pip install -r requirements.txt && pip install --no-deps -e .
    # Ровно один процесс: бот и API живут вместе
    startCommand: uvicorn concert_pnl.api.app:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: BOT_MODE
        value: webhook
      - key: BOT_TOKEN
        sync: false
